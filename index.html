<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicador Global de Divisas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Indicador Global de Divisas</h1>
            <p>Cotizaciones internacionales en tiempo real y conversor universal</p>
        </header>

        <!-- Tarjetas de cotización dinámicas (Solo divisas extranjeras) -->
        <main id="divisas-grid" class="grid">
            <p class="loading">Cargando cotizaciones...</p>
        </main>

        <!-- Panel Interactivo de Conversión -->
        <section class="converter-card">
            <h2>🧮 Conversor Universal</h2>
            
            <div class="converter-controls">
                <div class="input-group">
                    <label for="input-monto">Monto</label>
                    <input type="number" id="input-monto" placeholder="0.00" value="1000" min="0">
                </div>

                <div class="input-group">
                    <label for="select-origen">De</label>
                    <select id="select-origen">
                        <option value="ARS">Peso Argentino (ARS)</option>
                        <option value="USD">Dólar (USD)</option>
                        <option value="EUR">Euro (EUR)</option>
                        <option value="BRL">Real (BRL)</option>
                        <option value="CNY">Yuan (CNY)</option>
                        <option value="NGN">Naira (NGN)</option>
                        <option value="GBP">Libra (GBP)</option>
                        <option value="JPY">Yen (JPY)</option>
                    </select>
                </div>

                <span class="equals-sign">⇄</span>

                <div class="input-group">
                    <label for="select-destino">A</label>
                    <select id="select-destino">
                        <option value="ARS">Peso Argentino (ARS)</option>
                        <option value="USD" selected>Dólar (USD)</option>
                        <option value="EUR">Euro (EUR)</option>
                        <option value="BRL">Real (BRL)</option>
                        <option value="CNY">Yuan (CNY)</option>
                        <option value="NGN">Naira (NGN)</option>
                        <option value="GBP">Libra (GBP)</option>
                        <option value="JPY">Yen (JPY)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="input-resultado">Resultado</label>
                    <input type="text" id="input-resultado" value="0.00" readonly>
                </div>
            </div>
        </section>

        <footer>
            <p>Desarrollado por <strong>David Oviri Oghoerore Alegbe</strong> | Python & Web Dev</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
